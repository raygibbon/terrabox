[package]
name = "terrabox"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A low-level, cell-oriented terminal engine written in Rust"
repository = "https://github.com/raygibbon/terrabox"
readme = "README.md"
keywords = ["terminal", "tui", "console", "ansi"]
categories = ["command-line-interface"]

[dependencies]
unicode-width = "0.2"
unicode-segmentation = "1.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_IO", "Win32_Storage_FileSystem"] }

